<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guardianes de Usme · Mapa desde arriba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../comun/estilos.css">
  <style>
    /* Botón propio del mapa: «Ver todo el mapa», debajo de la barra de la capa común */
    .mapa-herramientas {
      position: fixed; left: 16px; top: 84px; z-index: 9;
      font-family: var(--gu-letra); font-size: calc(18px * var(--gu-escala)); line-height: 1.45;
    }
    .mapa-herramientas { display: flex; gap: 8px; flex-wrap: wrap; }
    .mapa-herramientas[hidden] { display: none; }
    .mapa-herramientas .gu-btn { box-shadow: var(--gu-sombra); }
    .mapa-herramientas .gu-btn[aria-pressed="true"] { background: var(--gu-principal); border-color: #fff; color: var(--gu-principal-tinta); }
    .mapa-herramientas .gu-btn:focus-visible { outline: 5px solid var(--gu-foco); outline-offset: 4px; }
    @media (max-width: 700px) {
      .mapa-herramientas { left: 8px; font-size: calc(15px * var(--gu-escala)); }
      .mapa-herramientas .gu-btn { min-height: 48px; padding: .4em .9em; }
      .mapa-inicio-texto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    }
    #mundo { background: #e3d4ad; }
  </style>
</head>
<body>
  <main id="mundo" aria-label="Dibujo del parque. Todo lo importante se cuenta en texto y voz."></main>
  <script src="../vendor/phaser.min.js"></script>
  <script src="../comun/contenido.js"></script>
  <script src="../comun/audio.js"></script>
  <script src="../comun/voz.js"></script>
  <script src="../comun/juego.js"></script>
  <script src="../plataforma/datos.js"></script>
  <script src="mapa.js"></script>
  <script src="dibujos.js"></script>
  <script src="minijuegos.js"></script>
  <script src="mundo.js"></script>
</body>
</html>
